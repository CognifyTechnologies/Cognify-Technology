<section class="stats-strip-section">
  <div class="container">
    <div class="stats-grid">
      @for (stat of stats; track stat.label) {
        <div class="stat-card" appScrollReveal>
          <div class="stat-icon-wrapper">
            <i [class]="'bi ' + stat.icon"></i>
          </div>
          <div class="stat-value" [appCountUp]="stat.value" [countSuffix]="stat.suffix">
            0{{ stat.suffix }}
          </div>
          <h3 class="stat-title">{{ stat.label }}</h3>
          <p class="stat-desc">{{ stat.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
