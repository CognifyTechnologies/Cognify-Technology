<div class="custom-select-wrapper" [class.is-open]="isOpen()" [class.is-disabled]="isDisabled()">
  <!-- Select Trigger Box -->
  <button
    type="button"
    class="select-trigger"
    [id]="inputId"
    [attr.aria-expanded]="isOpen()"
    [disabled]="isDisabled()"
    (click)="toggleOpen()"
  >
    <span class="selected-text" [class.placeholder]="!selectedValue()">
      {{ selectedValue() || placeholder }}
    </span>
    <span class="chevron-icon">
      <i class="bi bi-chevron-down"></i>
    </span>
  </button>

  <!-- Floating Custom Options Dropdown -->
  @if (isOpen()) {
    <div class="select-dropdown-panel" role="listbox">
      <div class="options-scroller">
        @for (opt of options; track opt) {
          <div
            class="select-option-item"
            [class.selected]="opt === selectedValue()"
            role="option"
            [attr.aria-selected]="opt === selectedValue()"
            (click)="selectOption(opt, $event)"
          >
            <span class="option-label">{{ opt }}</span>
            @if (opt === selectedValue()) {
              <i class="bi bi-check2 check-icon"></i>
            }
          </div>
        }
      </div>
    </div>
  }
</div>
